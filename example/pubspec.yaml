name: mel_spectrogram_flutter_example
description: "Demonstrates how to use the mel_spectrogram_flutter plugin."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  mel_spectrogram_flutter:
    path: ../

  path_provider: ^2.1.5
  path: ^1.9.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/